<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Grid</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: #f5f5f5;
      color: #222;
    }
    h1 { text-align: center; color: #333; margin: 0 0 24px; }
    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      min-width: 0;
      background: white;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 6px #00000018;
    }
    .card img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card h2 { font-size: 1.2rem; margin: 12px 0 6px; }
    .price { color: #16803c; font-weight: bold; }
    button {
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 5px;
      background: #2563eb;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:hover, button:focus-visible { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    @media (max-width: 768px) {
      body { padding: 20px; }
      .products { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .card img { height: 170px; }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      h1 { font-size: 1.6rem; }
      .products { grid-template-columns: 1fr; gap: 14px; }
      .card { padding: 14px; }
      .card img { height: auto; aspect-ratio: 16 / 9; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <h1>Our Products</h1>
  <main class="products">
    <article class="card">
      <img src="https://picsum.photos/seed/headphones/400/250" alt="Headphones">
      <h2>Headphones</h2><p class="price">₹999</p><button type="button">Buy Now</button>
    </article>
    <article class="card">
      <img src="https://picsum.photos/seed/watch/400/250" alt="Watch">
      <h2>Smart Watch</h2><p class="price">₹1,499</p><button type="button">Buy Now</button>
    </article>
    <article class="card">
      <img src="https://picsum.photos/seed/shoes/400/250" alt="Shoes">
      <h2>Shoes</h2><p class="price">₹1,199</p><button type="button">Buy Now</button>
    </article>
    <article class="card">
      <img src="https://picsum.photos/seed/bag/400/250" alt="Bag">
      <h2>Backpack</h2><p class="price">₹799</p><button type="button">Buy Now</button>
    </article>
    <article class="card">
      <img src="https://picsum.photos/seed/speaker/400/250" alt="Speaker">
      <h2>Speaker</h2><p class="price">₹1,299</p><button type="button">Buy Now</button>
    </article>
    <article class="card">
      <img src="https://picsum.photos/seed/camera/400/250" alt="Camera">
      <h2>Camera</h2><p class="price">₹4,999</p><button type="button">Buy Now</button>
    </article>
  </main>
</body>
</html>

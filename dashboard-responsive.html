<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: #f1f5f9;
      color: #172033;
    }
    .dashboard {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      grid-template-rows: auto 1fr auto;
      grid-template-areas: "header header" "sidebar main" "footer footer";
      gap: 12px;
      padding: 12px;
    }
    header {
      grid-area: header;
      background: #2563eb;
      color: white;
      padding: 16px 22px;
      border-radius: 8px;
    }
    header h1 { margin: 0; font-size: 1.6rem; }
    aside {
      grid-area: sidebar;
      background: #1e293b;
      color: white;
      padding: 20px;
      border-radius: 8px;
    }
    aside h2 { margin-top: 0; font-size: 1.2rem; }
    aside a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 8px 0;
      padding: 10px 12px;
      border-radius: 6px;
    }
    aside a:hover, aside a:focus-visible { background: #334155; outline-offset: 3px; }
    main {
      grid-area: main;
      min-width: 0;
      background: white;
      padding: 22px;
      border-radius: 8px;
    }
    main h2 { margin-top: 0; }
    footer {
      grid-area: footer;
      background: #cbd5e1;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
    }
    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 10px;
        padding: 10px;
      }
      main { padding: 18px; }
    }
    @media (max-width: 480px) {
      .dashboard {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto 1fr auto;
        grid-template-areas: "header" "sidebar" "main" "footer";
        gap: 10px;
        padding: 10px;
      }
      header, aside, main { padding: 16px; }
      header h1 { font-size: 1.35rem; }
      aside nav {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      aside a { margin: 0; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <header><h1>My Dashboard</h1></header>
    <aside>
      <h2>Menu</h2>
      <nav aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Settings</a>
        <a href="#">Help</a>
      </nav>
    </aside>
    <main>
      <h2>Welcome!</h2>
      <p>This is the main area of the dashboard.</p>
      <p>CSS Grid helps us arrange the header, sidebar, main content and footer.</p>
    </main>
    <footer>© 2026 My Dashboard</footer>
  </div>
</body>
</html>
